<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGradOpen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F6F8"/>
    </linearGradient>

    <!-- Folder Back Plate Gradient -->
    <linearGradient id="backPlateGradOpen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#037B79"/>
      <stop offset="50%" stop-color="#059B83"/>
      <stop offset="100%" stop-color="#07B089"/>
    </linearGradient>

    <!-- File Document Sheet Gradient -->
    <linearGradient id="docSheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Front Flap Angled Perspective Gradient -->
    <linearGradient id="frontFlapOpenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08BA92"/>
      <stop offset="50%" stop-color="#09CF9F"/>
      <stop offset="100%" stop-color="#12E7AC"/>
    </linearGradient>

    <!-- Deep Inner Pocket Cavity Gradient -->
    <linearGradient id="pocketCavityGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#023D3A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#03665F" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="squircleShadowOpen" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#074D45" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.06"/>
    </filter>

    <filter id="sheetShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#023D3A" flood-opacity="0.35"/>
    </filter>

    <filter id="frontFlapShadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#023D3A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Clean App Squircle Base (Apple Style Icon Container) -->
  <rect x="48" y="48" width="928" height="928" rx="216" fill="url(#bgGradOpen)" filter="url(#squircleShadowOpen)"/>
  <rect x="48" y="48" width="928" height="928" rx="216" fill="none" stroke="#E2E8F0" stroke-width="2.5" opacity="0.6"/>

  <!-- 1. Back Folder Plate -->
  <path d="
    M 264 250
    L 410 250
    C 455 250 480 270 515 320
    C 530 338 550 342 580 342
    L 760 342
    C 804 342 814 352 814 396
    L 814 716
    C 814 760 804 770 760 770
    L 264 770
    C 220 770 210 760 210 716
    L 210 304
    C 210 260 220 250 264 250
    Z
  " fill="url(#backPlateGradOpen)"/>

  <!-- Inner Dark Pocket Cavity -->
  <rect x="210" y="342" width="604" height="260" fill="url(#pocketCavityGrad)"/>

  <!-- 2. Crisp File / Document Sheet Peeking Out of Open Pocket -->
  <!-- Sheet extends from y=210 to y=580, angled slightly for natural sweet charm -->
  <g transform="rotate(-3 512 400)" filter="url(#sheetShadow)">
    <!-- Main Sheet Body -->
    <path d="
      M 310 210
      L 620 210
      L 714 304
      L 714 590
      C 714 606 702 618 686 618
      L 310 618
      C 294 618 282 606 282 590
      L 282 238
      C 282 222 294 210 310 210
      Z
    " fill="url(#docSheetGrad)" stroke="#E2E8F0" stroke-width="2"/>

    <!-- Dog-Ear Fold on Sheet -->
    <path d="
      M 620 210
      L 620 290
      C 620 302 630 304 642 304
      L 714 304
      Z
    " fill="#E2E8F0" opacity="0.9"/>
    <path d="
      M 620 210
      L 714 304
    " stroke="#CBD5E1" stroke-width="2"/>

    <!-- Document Decorative Badge / Content Pill -->
    <!-- Teal media badge on file -->
    <rect x="330" y="270" width="130" height="26" rx="13" fill="#07B38C" opacity="0.9"/>
    <!-- Small play triangle inside badge -->
    <polygon points="352,278 352,288 362,283" fill="#FFFFFF"/>
    <!-- Document Title Skeleton -->
    <rect x="474" y="278" width="110" height="10" rx="5" fill="#07B38C" opacity="0.4"/>

    <!-- Skeleton Document / Media Lines -->
    <rect x="330" y="330" width="310" height="12" rx="6" fill="#94A3B8" opacity="0.45"/>
    <rect x="330" y="360" width="270" height="10" rx="5" fill="#94A3B8" opacity="0.3"/>
    <rect x="330" y="388" width="290" height="10" rx="5" fill="#94A3B8" opacity="0.3"/>
    <rect x="330" y="416" width="220" height="10" rx="5" fill="#94A3B8" opacity="0.3"/>

    <!-- Subtle Media Waveform / Timeline Graphic on Sheet -->
    <rect x="330" y="446" width="320" height="34" rx="8" fill="#F1F5F9"/>
    <path d="
      M 345 463 L 360 455 L 375 470 L 390 452 L 405 474 L 420 458 L 435 466 L 450 454 L 465 472
      L 480 460 L 495 468 L 510 453 L 525 471 L 540 459 L 555 467 L 570 454 L 585 470 L 600 462
    " fill="none" stroke="#07B38C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 3. Angled Front Folder Flap (Opened Forward in Perspective) -->
  <g filter="url(#frontFlapShadow)">
    <path d="
      M 230 488
      C 230 468 244 456 268 456
      L 756 456
      C 780 456 794 468 794 488
      L 820 716
      C 824 760 804 774 760 774
      L 264 774
      C 220 774 200 760 204 716
      Z
    " fill="url(#frontFlapOpenGrad)"/>

    <!-- Front Flap Top Rim Light Accent -->
    <path d="
      M 268 458
      L 756 458
    " stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/>

    <!-- Inside Pocket Edge Gradient line -->
    <path d="
      M 240 466
      L 784 466
    " stroke="#024D46" stroke-width="2" opacity="0.4"/>
  </g>
</svg>
