<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Folder Back Plate Gradient (Deep Saturated Teal) -->
    <linearGradient id="backPlateGradOpen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#025452"/>
      <stop offset="45%" stop-color="#037B6E"/>
      <stop offset="100%" stop-color="#069E7B"/>
    </linearGradient>

    <!-- Deep Cavity Interior Shadow -->
    <linearGradient id="innerCavityGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#012422" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#024D46" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Document Sheet Gradient -->
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Front Flap Angled Perspective Gradient -->
    <linearGradient id="frontFlapOpenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B08E"/>
      <stop offset="45%" stop-color="#08CA9B"/>
      <stop offset="100%" stop-color="#14F5B4"/>
    </linearGradient>

    <!-- Floating Ambient Drop Shadow -->
    <filter id="floatShadowOpen" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="36" stdDeviation="36" flood-color="#012422" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Sheet Pop Shadow Inside Folder -->
    <filter id="sheetDropShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#011F1D" flood-opacity="0.5"/>
    </filter>

    <!-- Front Flap Forward Shadow -->
    <filter id="flapForwardShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#012825" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#floatShadowOpen)">
    <!-- 1. Back Folder Plate -->
    <path d="
      M 190 190
      L 390 190
      C 445 190 475 215 515 275
      C 535 298 560 304 600 304
      L 834 304
      C 888 304 904 320 904 374
      L 904 786
      C 904 840 888 856 834 856
      L 190 856
      C 136 856 120 840 120 786
      L 120 260
      C 120 206 136 190 190 190
      Z
    " fill="url(#backPlateGradOpen)" stroke="#024744" stroke-width="4"/>

    <!-- Deep Inner Cavity / Pocket -->
    <rect x="124" y="304" width="776" height="340" fill="url(#innerCavityGrad)"/>

    <!-- 2. Crisp, High-Contrast Document Sheet Peeking Out of Open Folder -->
    <g transform="rotate(-3.5 512 380)" filter="url(#sheetDropShadow)">
      <!-- Sheet Body -->
      <path d="
        M 250 130
        L 640 130
        L 770 260
        L 770 660
        C 770 678 756 692 738 692
        L 250 692
        C 232 692 218 678 218 660
        L 218 162
        C 218 144 232 130 250 130
        Z
      " fill="url(#sheetGrad)" stroke="#64748B" stroke-width="3"/>

      <!-- Dog-Ear Fold Flap -->
      <path d="
        M 640 130
        L 640 242
        C 640 256 652 260 666 260
        L 770 260
        Z
      " fill="#CBD5E1"/>
      <path d="M 640 130 L 770 260" stroke="#94A3B8" stroke-width="2.5"/>

      <!-- High-Contrast Indigo Media Badge on Sheet -->
      <rect x="270" y="210" width="160" height="34" rx="17" fill="#4F46E5"/>
      <!-- Play Triangle Inside Badge -->
      <polygon points="296,220 296,234 310,227" fill="#FFFFFF"/>
      <text x="322" y="233" fill="#FFFFFF" font-size="14" font-weight="800" font-family="-apple-system, sans-serif" letter-spacing="1">MEDIA</text>

      <!-- Skeleton Lines for Document Visual Structure -->
      <rect x="270" y="280" width="380" height="16" rx="8" fill="#64748B" opacity="0.65"/>
      <rect x="270" y="316" width="320" height="14" rx="7" fill="#94A3B8" opacity="0.5"/>
      <rect x="270" y="348" width="350" height="14" rx="7" fill="#94A3B8" opacity="0.5"/>
      <rect x="270" y="380" width="260" height="14" rx="7" fill="#94A3B8" opacity="0.5"/>

      <!-- Audio / Video Waveform Track -->
      <rect x="270" y="420" width="410" height="42" rx="10" fill="#E2E8F0"/>
      <path d="
        M 288 441 L 306 430 L 324 450 L 342 426 L 360 455 L 378 435 L 396 446 L 414 430 L 432 452
        L 450 436 L 468 448 L 486 428 L 504 451 L 522 437 L 540 447 L 558 431 L 576 450 L 594 440
        L 612 449 L 630 433 L 648 446 L 666 438
      " fill="none" stroke="#4F46E5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 3. Angled Front Folder Flap (Opened Forward in Perspective) -->
    <g filter="url(#flapForwardShadow)">
      <path d="
        M 150 490
        C 150 466 168 450 200 450
        L 824 450
        C 856 450 874 466 874 490
        L 908 786
        C 912 840 888 860 834 860
        L 190 860
        C 136 860 112 840 116 786
        Z
      " fill="url(#frontFlapOpenGrad)" stroke="#035B54" stroke-width="4.5"/>

      <!-- Front Flap Top Rim Gloss Highlight -->
      <path d="
        M 198 454
        L 826 454
      " stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.85"/>

      <!-- Dark Inside Lip Line -->
      <path d="
        M 160 464
        L 864 464
      " stroke="#013A37" stroke-width="3" opacity="0.5"/>
    </g>
  </g>
</svg>
