<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F6F8"/>
    </linearGradient>

    <!-- Folder Back Plate Gradient (Teal to Emerald) -->
    <linearGradient id="backPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#048C8A"/>
      <stop offset="50%" stop-color="#06A88E"/>
      <stop offset="100%" stop-color="#08BD93"/>
    </linearGradient>

    <!-- Folder Front Flap Gradient (Vibrant Emerald Mint) -->
    <linearGradient id="frontFlapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07B38C"/>
      <stop offset="50%" stop-color="#09C496"/>
      <stop offset="100%" stop-color="#0FDCA3"/>
    </linearGradient>

    <!-- Pocket Shadow inside folder -->
    <linearGradient id="pocketShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#025B57" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#025B57" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="squircleShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#074D45" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.06"/>
    </filter>

    <filter id="folderShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#03453E" flood-opacity="0.25"/>
    </filter>

    <filter id="slitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFFFFF" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Clean App Squircle Base (Apple Style Icon Container) -->
  <rect x="48" y="48" width="928" height="928" rx="216" fill="url(#bgGrad)" filter="url(#squircleShadow)"/>
  <rect x="48" y="48" width="928" height="928" rx="216" fill="none" stroke="#E2E8F0" stroke-width="2.5" opacity="0.6"/>

  <!-- Main Folder Structure -->
  <g filter="url(#folderShadow)">
    <!-- Back Folder Plate with Left Tab -->
    <!-- Tab starts x=210, y=250. Smooth curve to shoulder at y=330. Body down to y=770 -->
    <path d="
      M 264 250
      L 410 250
      C 455 250 480 270 515 320
      C 530 338 550 342 580 342
      L 760 342
      C 804 342 814 352 814 396
      L 814 716
      C 814 760 804 770 760 770
      L 264 770
      C 220 770 210 760 210 716
      L 210 304
      C 210 260 220 250 264 250
      Z
    " fill="url(#backPlateGrad)"/>

    <!-- Subtle Tab Highlight -->
    <path d="
      M 264 252
      L 408 252
      C 450 252 475 272 510 320
    " fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.45"/>

    <!-- Inside Pocket Shadow -->
    <rect x="210" y="342" width="604" height="120" fill="url(#pocketShadow)" opacity="0.5"/>

    <!-- The Sweet Curved Opening Slit (From User Image) -->
    <!-- Curved white crescent gap that separates back tab and front flap -->
    <path d="
      M 218 424
      C 230 398 255 388 290 388
      L 734 388
      C 769 388 794 398 806 424
      C 794 406 769 398 734 398
      L 290 398
      C 255 398 230 406 218 424
      Z
    " fill="#FFFFFF" opacity="0.95" filter="url(#slitGlow)"/>

    <!-- Front Folder Flap Body -->
    <path d="
      M 264 408
      L 760 408
      C 804 408 814 418 814 462
      L 814 716
      C 814 760 804 770 760 770
      L 264 770
      C 220 770 210 760 210 716
      L 210 462
      C 210 418 220 408 264 408
      Z
    " fill="url(#frontFlapGrad)"/>

    <!-- Front Flap Top Rim Highlight -->
    <path d="
      M 264 410
      L 760 410
    " stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>

    <!-- Bottom Ambient Reflective Glow -->
    <path d="
      M 250 768
      L 774 768
    " stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.25"/>
  </g>
</svg>
