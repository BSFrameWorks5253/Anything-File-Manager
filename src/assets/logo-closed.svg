<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Folder Back Plate Gradient (Deep Saturated Teal-Cyan) -->
    <linearGradient id="backPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#026361"/>
      <stop offset="45%" stop-color="#048A7B"/>
      <stop offset="100%" stop-color="#07B38C"/>
    </linearGradient>

    <!-- Folder Front Flap Gradient (Vibrant Mint-Emerald) -->
    <linearGradient id="frontFlapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05A384"/>
      <stop offset="40%" stop-color="#08C296"/>
      <stop offset="100%" stop-color="#12E5A8"/>
    </linearGradient>

    <!-- Top Highlight Rim -->
    <linearGradient id="topRimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Pocket Crease Shadow -->
    <linearGradient id="creaseShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#013A37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#013A37" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Ambient Floating Drop Shadow (Allows icon to pop on ANY light/dark background) -->
    <filter id="floatShadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="36" stdDeviation="36" flood-color="#012422" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Opening Slit Glow -->
    <filter id="slitShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#013835" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Main Folder Group with Floating Ambient Shadow -->
  <g filter="url(#floatShadow)">
    <!-- Back Plate with Top-Left Tab -->
    <!-- Tab starts x=120, y=190. Smooth bezier curve to shoulder at y=290, body down to y=850, x=904 -->
    <path d="
      M 190 190
      L 390 190
      C 445 190 475 215 515 275
      C 535 298 560 304 600 304
      L 834 304
      C 888 304 904 320 904 374
      L 904 786
      C 904 840 888 856 834 856
      L 190 856
      C 136 856 120 840 120 786
      L 120 260
      C 120 206 136 190 190 190
      Z
    " fill="url(#backPlateGrad)" stroke="#024744" stroke-width="4"/>

    <!-- Subtle Tab Highlight Arc -->
    <path d="
      M 190 194
      L 388 194
      C 440 194 470 218 510 274
    " fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Dark Crease behind front flap -->
    <rect x="124" y="304" width="776" height="160" fill="url(#creaseShadow)"/>

    <!-- The Sweet Curved Crescent Opening Slit (Enhanced with Depth Shadow) -->
    <path d="
      M 132 400
      C 150 364 190 350 240 350
      L 784 350
      C 834 350 874 364 892 400
      C 874 376 834 364 784 364
      L 240 364
      C 190 364 150 376 132 400
      Z
    " fill="#FFFFFF" opacity="0.95" filter="url(#slitShadow)"/>

    <!-- Front Folder Flap Body -->
    <path d="
      M 190 380
      L 834 380
      C 888 380 904 396 904 450
      L 904 786
      C 904 840 888 856 834 856
      L 190 856
      C 136 856 120 840 120 786
      L 120 450
      C 120 396 136 380 190 380
      Z
    " fill="url(#frontFlapGrad)" stroke="#035B54" stroke-width="4"/>

    <!-- Front Flap Top Rim Gloss Highlight -->
    <path d="
      M 190 384
      L 834 384
    " stroke="url(#topRimGrad)" stroke-width="5" stroke-linecap="round"/>

    <!-- Subtle Bottom Contour Highlight -->
    <path d="
      M 170 852
      L 854 852
    " stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  </g>
</svg>
